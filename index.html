<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Camera Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f7;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px;
            gap: 16px;
        }

        .preview-box {
            flex: 1;
            border: 1.5px dashed #d0d0d0;
            border-radius: 18px;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 12px;
        }

        .placeholder {
            color: #9aa0a6;
            font-size: 14px;
        }

        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 12px;
        }

        .bottom {
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 14px;
            background: #111;
            color: #fff;
            border: none;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.85;
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="preview-box">
        <span id="placeholder" class="placeholder">Chưa có ảnh</span>
        <img id="preview"/>
    </div>

    <div class="bottom">
        <button class="btn" onclick="openCamera()">

            <!-- icon camera hiện đại dạng SVG -->
            <svg class="icon" viewBox="0 0 24 24" fill="none">
                <path d="M9 4L7.5 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2.5L15 4H9z"
                      stroke="white" stroke-width="1.5"/>
                <circle cx="12" cy="13" r="3.5" stroke="white" stroke-width="1.5"/>
            </svg>

            Chụp ảnh
        </button>
    </div>

</div>

<script>
    function openCamera() {
        if (window.JSBridge && JSBridge.openCamera) {
            JSBridge.openCamera();
        } else {
            alert("JSBridge not found");
        }
    }

    window.onImageCaptured = function(base64) {
        var img = document.getElementById("preview");
        var placeholder = document.getElementById("placeholder");

        img.src = base64;
        img.style.display = "block";

        if (placeholder) {
            placeholder.style.display = "none";
        }
    }
</script>

</body>
</html>
